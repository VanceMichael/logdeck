rubrics:
  - id: 1
    type: f2p
    text: 规则触发时在入队前捕获完整且不可变的通道 revision 与启用通道快照，包含稳定 ID、类型、目标和发送参数；后续编辑、禁用或删除不改变该告警。
  - id: 2
    type: f2p
    text: 通道保存与规则触发并发时，整次告警只使用完整旧 revision 或完整新 revision，不会混用不同通道或参数；配置持久化失败不会发布 revision 或改变待发计划。
  - id: 3
    type: f2p
    text: dispatch 队列、并发 fan-out 与所有重试都携带同一快照和稳定通道身份，编辑、禁用或删除只影响未来触发，重试不会重新读取当前配置。
  - id: 4
    type: f2p
    text: 单个快照通道失败或超时不阻塞其他通道；历史按通道记录与快照身份关联且已脱敏的结果，恢复后的重试仍指向原目标，错误、API 和日志均不泄漏 token。
  - id: 5
    type: f2p
    text: 服务 shutdown 的有界收尾为每个未完成快照通道留下确定终态，不会切换到当前配置、重复 fan-out 或泄漏 worker。
  - id: 6
    type: p2p
    text: 没有启用通道时仍只记历史；测试通知使用操作者当前选择的配置；规则冷却、旧版历史读取、正常即时投递以及 Web、CLI 展示保持兼容。
  - id: 7
    type: f2p
    text: 自动化验证覆盖通道编辑与删除竞态、配置落盘失败、部分通道失败、原目标重试、秘密脱敏和 shutdown，并分别证明 old/new revision 不混合。
